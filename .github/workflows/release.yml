name: 'Build and Release Bloxel'

on:
  push:
    branches:
      - main # Triggers the workflow on each push to the main branch

jobs:
  build-and-release:
    name: 'Build and Release'
    permissions:
      contents: write # Needed to create the release and upload assets
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-latest, windows-latest] # Build for Linux and Windows

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.0-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install frontend dependencies
        run: npm install

      - name: Build, Tag, Release, and Upload
        uses: tauri-apps/tauri-action@v0
        env:
          # This is the only token you need, and it's automatically provided by GitHub
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The tagName will be read from your tauri.conf.json and prefixed with 'v'
          # e.g., if version is "1.2.3", the tag will be "v1.2.3"
          tagName: bloxel-v__VERSION__ # The action replaces __VERSION__ with the version from your tauri.conf.json

          # The release name will also use the version from the config file
          releaseName: 'Bloxel v__VERSION__'

          # A brief description for the release body
          releaseBody: 'New release of the Bloxel application.'
          
          # Set to false to publish the release immediately
          releaseDraft: false

          # Set to false for a full release
          prerelease: false
